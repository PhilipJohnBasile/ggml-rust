[workspace]
members = [
    "crates/gguf",
    "crates/mmap",
    "tools/gguf-inspect",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PhilipJohnBasile/ggml-rust"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
